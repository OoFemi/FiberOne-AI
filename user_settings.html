<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Atlas AI Settings</title>

<style>

body{
    font-family:Segoe UI,sans-serif;
    background:#f4f6f9;
    padding:30px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.setting{
    margin-bottom:30px;
}

h1{
    margin-bottom:30px;
}

h3{
    margin-bottom:10px;
}

input[type=text]{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    padding:12px 20px;
    background:#4da3ff;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#2f89ee;
}

.back-link{
    display:inline-block;
    margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<h1>⚙ User Settings</h1>

<div class="setting">

<h3>👤 Profile Name</h3>

<input
type="text"
id="profileName"
placeholder="Enter your name">

</div>

<div class="setting">

<h3>🎨 Theme</h3>

<label>
<input
type="radio"
name="theme"
value="dark">
Dark Mode
</label>

<br><br>

<label>
<input
type="radio"
name="theme"
value="light">
Light Mode
</label>

</div>

<div class="setting">

<h3>💬 Chat History</h3>

<label>

<input
type="checkbox"
id="chatHistory">

Enable Chat History

</label>


<br><br>

<button onclick="clearHistory()">
Clear Chat History
</button>

</div>

<button onclick="saveSettings()">
Save Settings
</button>

<br><br>

<a
class="back-link"
href="chat.html">

← Back to Chat

</a>

</div>

<script>

function loadSettings(){

    document.getElementById(
        "profileName"
    ).value =

    localStorage.getItem(
        "profileName"
    ) || "";

    const theme =
    localStorage.getItem(
        "theme"
    ) || "dark";

    document.querySelector(
        `input[value="${theme}"]`
    ).checked = true;

    document.getElementById(
        "chatHistory"
    ).checked =

    localStorage.getItem(
        "chatHistory"
    ) === "true";

}

function saveSettings(){

    localStorage.setItem(
        "profileName",
        document.getElementById(
            "profileName"
        ).value
    );

    const theme =
    document.querySelector(
        'input[name="theme"]:checked'
    ).value;

    localStorage.setItem(
        "theme",
        theme
    );

    localStorage.setItem(
        "chatHistory",
        document.getElementById(
            "chatHistory"
        ).checked
    );

    alert(
        "Settings Saved Successfully"
    );

}

function clearHistory(){

    localStorage.removeItem(
        "savedChat"
    );

    alert(
        "Chat History Cleared"
    );

}

loadSettings();

</script>

</body>
</html>
