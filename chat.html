<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Atlas AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI,sans-serif;
    background:#1e1f2b;
    color:white;
    display:flex;
    height:100vh;
}

.sidebar{
    width:250px;
    background:#11131d;
    border-right:1px solid #2f3246;
    padding:20px;
}

.sidebar img{
    width:180px;
    display:block;
    margin:0 auto 20px auto;
}

.sidebar-user{
    text-align:center;
    margin-bottom:25px;
    font-size:13px;
    color:#666;
    line-height:1.6;
}

.sidebar-user strong{
    color:#111827;
    font-size:15px;



}

.sidebar button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    margin-bottom:12px;
    background:#4da3ff;
    color:white;
    cursor:pointer;
    font-size:14px;
}

.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

.header{
    height:80px;
    background:#11131d;
    display:flex;
    align-items:center;
    padding:0 25px;
}

#aiTitle{
    font-size:16px;
    font-weight:600;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:25px;
    display:flex;
    flex-direction:column;
    
}


.message{
    max-width:700px;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}

.ai{
    background:#2b2f46;
    line-height:1.6;
    align-self:flex-start;
}

.user{
    background:#4da3ff;
    align-self:flex-end;
}

.input-area{
    display:flex;
    padding:15px;
    background:#11131d;
}

.input-area input{
    flex:1;
    padding:16px;
    border:none;
    border-radius:8px;
    font-size:15px;
}

.input-area button{
    padding:14px 20px;
    margin-left:10px;
    border:none;
    border-radius:8px;
    background:#4da3ff;
    color:white;
    cursor:pointer;
}

.clear-btn{
    background:#ef4444 !important;
}

.clear-btn:hover{
    background:#dc2626 !important;
}

.welcome-card{
    width:700px;
    max-width:90%;
}


/* LIGHT MODE */

body.light-mode{
    background:#f9fafb;
    color:#111827;
}

body.light-mode .sidebar{
    background:#ffffff;
    border-right:1px solid #e5e7eb;
}

body.light-mode .header{
    background:#ffffff;
    border-bottom:1px solid #e5e7eb;
}

body.light-mode .main{
    background:#f9fafb;
}

body.light-mode .chat{
    background:#f9fafb;
}

body.light-mode .ai{
    background:#f3f4f6;
    color:#111827;
    border:1px solid #e5e7eb;
}

body.light-mode .user{
    background:#4da3ff;
    color:white;
}

body.light-mode .input-area{
    background:#ffffff;
}

body.light-mode .input-area input{
    background:#ffffff;
    color:#111827;
    border:1px solid #d1d5db;
}

body.light-mode #aiTitle{
    color:#111827;
}

</style>

</head>

<body>

<div class="sidebar">

    <img
        src="logo.png"
        alt="Logo">

    <div id="sidebarUser" class="sidebar-user">
    Welcome,<br>
    <strong>User</strong>
</div>

    <button onclick="newChat()">
        + New Chat
    </button>

    <button onclick="openSettings()">
        ⚙ Settings
    </button>

    <button onclick="window.location.href='admin.html'">
  👤 Admin
</button>

</div>

<div class="main">

    <div class="header">

        <h1 id="aiTitle">
            Atlas AI
        </h1>

    </div>

    <div
        id="chat"
        class="chat">
    </div>

    <div class="input-area">

        <input
            id="question"
            placeholder="Ask Atlas AI anything..."
            onkeydown="if(event.key==='Enter') send()">

        <button onclick="send()">
            Send
        </button>

        <button
            class="clear-btn"
            onclick="clearChat()">

            🗑 Clear

        </button>

    </div>

</div>

<script>

const chat =
document.getElementById(
    "chat"
);

const profileName =
localStorage.getItem(
    "profileName"
);

if(profileName){

    document.getElementById(
    "sidebarUser"
).innerHTML =
"Welcome,<br><strong>" +
profileName +
"</strong>";

}

window.onload=function(){

    const profileName =
    localStorage.getItem(
        "profileName"
    ) || "there";

    const historyEnabled =
    localStorage.getItem(
        "chatHistory"
    ) === "true";

    const savedChat =
    localStorage.getItem(
        "savedChat"
    );

    if(
        historyEnabled &&
        savedChat &&
        savedChat.trim() !== ""
    ){

        chat.innerHTML =
        savedChat;

    }
    else{

    const welcome =
addMessage(
    "👋 Welcome back, " +
    profileName +
    ".<br><br>" +
    "I am Olaah, your Atlas AI assistant.<br><br>" +
    "How can I help you today?<br><br>" +
    "<strong>Try asking:</strong><br><br>" +
    "📄 Summarise a document<br>" +
    "📧 Write an email<br>" +
    "📊 Generate a report<br>" +
    "💡 Explain a concept",
    "ai"
);

welcome.classList.add(
    "welcome-card"
);

}
};



function addMessage(text,type){

    const div =
    document.createElement(
        "div"
    );

    div.className =
    "message " + type;

    if(type==="ai"){
        div.innerHTML=text;
    }else{
        div.textContent=text;
    }

    chat.appendChild(div);

    if(
        localStorage.getItem(
            "chatHistory"
        ) === "true"
    ){

        localStorage.setItem(
            "savedChat",
            chat.innerHTML
        );

    }

    chat.scrollTop =
    chat.scrollHeight;

    return div;

}

function clearChat(){

    chat.innerHTML="";

    localStorage.removeItem(
        "savedChat"
    );

}

function newChat(){

    chat.innerHTML="";

    addMessage(
        "👋 New chat started.<br><br>How can I help you today?",
        "ai"
    );

}

function openSettings(){

    window.location.href =
    "settings.html";

}

async function send(){

    const input =
    document.getElementById(
        "question"
    );

    const question =
    input.value.trim();

    if(!question){
        return;
    }

    addMessage(
        question,
        "user"
    );

    input.value="";

    const typing =
    addMessage(
        "🤖 Thinking...",
        "ai"
    );

    try{

        const response =
        await fetch(
            "http://10.106.10.243:5678/webhook/ask-ai",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify({
                    question
                })
            }
        );

        const result =
        await response.json();

        typing.remove();

        addMessage(
            result.answer ||
            result.output ||
            result.text ||
            JSON.stringify(result),
            "ai"
        );

    }
    catch(error){

        typing.remove();

        addMessage(
            "❌ Unable to reach Atlas AI server.",
            "ai"
        );

    }

}

const theme =
localStorage.getItem(
    "theme"
);

if(theme==="light"){

    document.body.classList.add(
        "light-mode"
    );

}

</script>

</body>
</html>
