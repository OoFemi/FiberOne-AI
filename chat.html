<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Atlas AI</title>

<script src="https.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI, sans-serif;
    background:#1e1f2b;
    color:white;
    display:flex;
    height:100vh;
}

.sidebar{
    width:250px;
    background:#11131d;
    border-right:1px solid #2f3246;
    padding:20px;
}

.sidebar h2{
    margin-bottom:25px;
    color:#4da3ff;
}

.sidebar button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-bottom:12px;
    background:#4da3ff;
    color:white;
    cursor:pointer;
}

.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

.header{
    height:80px;
    background:#11131d;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 25px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-area img{
    height:50px;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:25px;
    display:flex;
    flex-direction:column;
}

.message{
    max-width:75%;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}

.ai{
    background:#2b2f46;
    align-self:flex-start;
}

.user{
    background:#4da3ff;
    align-self:flex-end;
}

.input-area{
    display:flex;
    padding:15px;
    background:#11131d;
}

.input-area input{
    flex:1;
    padding:14px;
    border:none;
    border-radius:8px;
}

.input-area button{
    padding:14px 20px;
    margin-left:10px;
    border:none;
    border-radius:8px;
    background:#4da3ff;
    color:white;
    cursor:pointer;
}

.typing{
    opacity:.7;
}

/* LIGHT MODE */

body.light-mode{
    background:#f9fafb;
    color:#111827;
}

body.light-mode .sidebar{
    background:#ffffff;
    border-right:1px solid #e5e7eb;
}

body.light-mode .sidebar h2{
    color:#4da3ff;
}

body.light-mode .header{
    background:#ffffff;
    border-bottom:1px solid #e5e7eb;
}

body.light-mode .main{
    background:#f9fafb;
}

body.light-mode .chat{
    background:#f9fafb;
}

body.light-mode .ai{
    background:#f3f4f6;
    color:#111827;
    border:1px solid #e5e7eb;
}

body.light-mode .user{
    background:#4da3ff;
    color:white;
}

body.light-mode .input-area{
    background:#ffffff;
    border-top:1px solid #e5e7eb;
}

body.light-mode .input-area input{
    background:white;
    color:#111827;
    border:1px solid #d1d5db;
}

body.light-mode .input-area button{
    background:#4da3ff;
    color:white;
}

body.light-mode #aiTitle{
    color:#111827;
}




</style>

</head>

<body>

<div class="sidebar">

    <h2>Atlas AI</h2>

    <button onclick="newChat()">
    + New Chat
</button>

<button onclick="openSettings()">
    ⚙ Settings
</button>

<button onclick="window.location.href='admin.html'">
  👤 Admin
</button>
</div>

<div class="main">

    <div class="header">

        <div class="logo-area">

            <img
                id="companyLogo"
                src="logo.png"
                alt="Logo">

            <h2 id="aiTitle">
                Atlas AI
            </h2>

        </div>

        <button onclick="clearChat()">
            Clear
        </button>

    </div>

    <div id="chat" class="chat"></div>

    <div class="input-area">

        <input
            id="question"
            placeholder="Ask Atlas AI..."
            onkeydown="if(event.key==='Enter') send()">

        <button onclick="send()">
            Send
        </button>

    </div>

</div>

<script>

const chat =
document.getElementById("chat");


window.onload=function(){

    const profileName =
    localStorage.getItem(
        "profileName"
    ) || "there";

    if(
        localStorage.getItem(
            "chatHistory"
        ) === "true"
        &&
        localStorage.getItem(
            "savedChat"
        )
    ){

        chat.innerHTML =
        localStorage.getItem(
            "savedChat"
        );

    }
    else{

        addMessage(
            "👋 Hello " +
            profileName +
            ".<br><br>I am Olaah, Your Atlas AI, How can I help you today?",
            "ai"
        );

    }

};



function addMessage(text,type){

    const div =
    document.createElement("div");

    div.className =
    "message " + type;

    if(type==="ai"){
        div.innerHTML=text;
    }else{
        div.textContent=text;
    }

    chat.appendChild(div);

if(
    localStorage.getItem(
        "chatHistory"
    ) === "true"
){

    localStorage.setItem(
        "savedChat",
        chat.innerHTML
    );

}

    chat.scrollTop =
    chat.scrollHeight;

    return div;
}

function clearChat(){

    chat.innerHTML="";

    localStorage.removeItem(
        "savedChat"
    );

}


function newChat(){

    chat.innerHTML="";

    addMessage(
        "👋 New chat started.<br><br>How can I help you today?",
        "ai"
    );

}

function openSettings(){

    window.location.href =
    "settings.html";

}

async function send(){

    const input =
    document.getElementById("question");

    const question =
    input.value.trim();

    if(!question) return;

    addMessage(
        question,
        "user"
    );

    input.value="";

    const typing =
    addMessage(
        "🤖 Thinking...",
        "ai"
    );

    try{

        const response =
        await fetch(
            "http://10.106.10.243:5678/webhook/ask-ai",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    question
                })
            }
        );

        const result =
        await response.json();

        typing.remove();

        addMessage(
            marked.parse(
                result.answer ||
                result.output ||
                result.text ||
                JSON.stringify(result)
            ),
            "ai"
        );

    }
    catch(error){

        typing.remove();

        addMessage(
            "❌ Unable to reach Atlas AI server.",
            "ai"
        );

        console.error(error);
    }
}


const theme =
localStorage.getItem(
    "theme"
);

if(theme==="light"){

    document.body.classList.add(
        "light-mode"
    );

}







</script>

</body>
</html>
