<div class="sidebar">

</div>

      

    </div>

    <div id="chat" class="chat"></div>

    <div class="input-area">

        <input
            id="question"
            placeholder="Ask Atlas AI about Atlas..."
            onkeydown="if(event.key==='Enter') send()">

        <button onclick="send()">
    Send
</button>

<button
class="clear-btn"
onclick="clearChat()">
🗑 Clear Chat

<script>

const chat =
document.getElementById("chat");


window.onload=function(){

    const profileName =
    localStorage.getItem(
        "profileName"
    ) || "there";

    if(
        localStorage.getItem(
            "chatHistory"
        ) === "true"
        &&
        localStorage.getItem(
            "savedChat"
        )
    ){

        chat.innerHTML =
        localStorage.getItem(
            "savedChat"
        );

    }
    else{
    
   addMessage(
           "👋 Welcome back, " +
profileName +
".<br><br>" +
"I am Olaah, your Atlas AI assistant.<br><br>" +
"How can I help you today?"
   


function addMessage(text,type){

    const div =
    document.createElement("div");

    div.className =
    "message " + type;

    if(type==="ai"){
        div.innerHTML=text;
    }else{
        div.textContent=text;
    }

    chat.appendChild(div);

if(
    localStorage.getItem(
        "chatHistory"
    ) === "true"
){

    localStorage.setItem(
        "savedChat",
        chat.innerHTML
    );

}

    chat.scrollTop =
    chat.scrollHeight;

    return div;
}

function clearChat(){

    chat.innerHTML="";

    localStorage.removeItem(
        "savedChat"
    );

}



  function newChat(){

    chat.innerHTML="";

    addMessage(
        "👋 New chat started.<br><br>How can I help you today?",
        "ai"
    );
}


function openSettings(){

    window.location.href =
    "settings.html";

}

async function send(){

    const input =
    document.getElementById("question");

    const question =
    input.value.trim();

    if(!question) return;

    addMessage(
        question,
        "user"
    );

    input.value="";

    const typing =
    addMessage(
        "🤖 Thinking...",
        "ai"
    );

    try{

        const response =
        await fetch(
            "http://10.106.10.243:5678/webhook/ask-ai",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    question
                })
            }
        );

        const result =
        await response.json();

        typing.remove();

        addMessage(
            marked.parse(
                result.answer ||
                result.output ||
                result.text ||
                JSON.stringify(result)
            ),
            "ai"
        );

    }
    catch(error){

        typing.remove();

        addMessage(
            "❌ Unable to reach Atlas AI server.",
            "ai"
        );

        console.error(error);
    }
}


const theme =
localStorage.getItem(
    "theme"
);

if(theme==="light"){

    document.body.classList.add(
        "light-mode"
    );

}







</script>
