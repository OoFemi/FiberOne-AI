<script>

const chat = document.getElementById("chat");

window.onload = function(){

    const historyEnabled =
    localStorage.getItem(
        "chatHistory"
    ) === "true";

    const savedChat =
    localStorage.getItem(
        "savedChat"
    );

    if(
        historyEnabled &&
        savedChat &&
        savedChat.trim() !== ""
    ){

        chat.innerHTML =
        savedChat;

    }
    else{

        fetch("get_session.php")
        .then(response => response.json())
        .then(data => {

            const name =
            data.logged_in
            ? data.name
            : "there";

            const welcome =
            addMessage(
                "👋 Welcome back, " +
                name +
                ".<br><br>" +
                "I am Olaah, your Atlas AI assistant.<br><br>" +
                "How can I help you today?<br><br>" +
                "<strong>Try asking:</strong><br><br>" +

                "✍️ Write an email<br>" +

                "💡 Explain a concept",
                "ai"
            );

            welcome.classList.add(
                "welcome-card"
            );

        });

    }

};

function addMessage(text,type){

    const div =
    document.createElement("div");

    div.className =
    "message " + type;

    if(type === "ai"){
        div.innerHTML = text;
    }else{
        div.textContent = text;
    }

    chat.appendChild(div);

    if(
        localStorage.getItem(
            "chatHistory"
        ) === "true"
    ){

        localStorage.setItem(
            "savedChat",
            chat.innerHTML
        );

    }

    chat.scrollTop =
    chat.scrollHeight;

    return div;

}

function clearChat(){

    chat.innerHTML = "";

    localStorage.removeItem(
        "savedChat"
    );

}

function newChat(){

    chat.innerHTML = "";

    addMessage(
        "👋 New chat started.<br><br>How can I help you today?",
        "ai"
    );

}

function openSettings(){

    window.location.href =
    "settings.html";

}
